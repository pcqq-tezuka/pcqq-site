<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PCQQ コマンド集</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --text:#26374f; --muted:#6b7a90; --border:#dde3ea;
  --accent:#4779bd; --accent-text:#fff; --code-bg:#1e2633; --code-text:#e6edf3;
  --ok:#2e8b57; --warn:#dd4335;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#11151c; --card:#1a2029; --text:#e6edf3; --muted:#8b97a8; --border:#2b3441; --code-bg:#0c1016; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.sub code{font-family:Consolas,"Cascadia Mono",monospace;background:var(--card);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.head h2{font-size:1.02rem;margin:0}
.tags{display:flex;gap:6px;align-items:center}
.tag{font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.tag.admin{border-color:var(--warn);color:var(--warn)}
.note{color:var(--muted);font-size:.86rem;margin:2px 0 0}
pre{background:var(--code-bg);color:var(--code-text);border-radius:6px;padding:12px;margin:10px 0 0;
  font-family:Consolas,"Cascadia Mono",monospace;font-size:.84rem;overflow:auto;max-height:260px;white-space:pre}
pre.open{max-height:none}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
button{border:0;border-radius:6px;padding:7px 14px;font-size:.88rem;cursor:pointer;
  background:var(--accent);color:var(--accent-text);white-space:nowrap}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--text);font-size:1rem;margin-bottom:16px}
.err{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>PCQQ コマンド集</h1>
  <p class="sub">コピーして貼り付け。<span style="color:var(--warn)">管理者</span>の付いたものは管理者で開いたターミナルへ。メニュー版：<code>irm pc-qq.net/s | iex</code></p>

  <input type="search" id="q" placeholder="絞り込み（例：共有、dns）">
  <div id="list"><p class="sub">読み込み中…</p></div>
</main>

<script>
const BASE = '/s/';

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  const old = btn.textContent; btn.textContent = 'コピーしました'; btn.classList.add('done');
  setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1500);
}

function el(tag, attrs = {}, text){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}

async function getCode(it){
  if (!it.file) return it.code || '';
  const res = await fetch(BASE + it.file, {cache:'no-store'});
  if (!res.ok) throw new Error(it.file + ' (' + res.status + ')');
  const code = await res.text();
  return (it.revert ? '$r=1\n' : '') + code;
}

function card(it){
  const c = el('div', {class:'card'});
  c.dataset.search = [it.name, it.note, it.file, it.code].join(' ').toLowerCase();

  const head = el('div', {class:'head'});
  head.append(el('h2', {}, it.name));
  const tags = el('div', {class:'tags'});
  tags.append(el('span', {class:'tag'}, it.shell === 'cmd' ? 'cmd' : 'PowerShell'));
  if (it.admin) tags.append(el('span', {class:'tag admin'}, '管理者'));
  head.append(tags);
  c.append(head);
  if (it.note) c.append(el('p', {class:'note'}, it.note));

  const pre = el('pre', {}, '読み込み中…');
  const tools = el('div', {class:'tools'});
  const more = el('button', {class:'ghost'}, '全体を表示'); more.hidden = true;
  const copy = el('button', {}, 'コピー'); copy.disabled = true;
  tools.append(more, copy);
  c.append(pre, tools);

  getCode(it).then(code => {
    pre.textContent = code;
    copy.disabled = false;
    copy.addEventListener('click', () => copyText(code, copy));
    requestAnimationFrame(() => {
      if (pre.scrollHeight > pre.clientHeight + 4) {
        more.hidden = false;
        more.addEventListener('click', () => {
          const open = pre.classList.toggle('open');
          more.textContent = open ? '折りたたむ' : '全体を表示';
        });
      }
    });
  }).catch(err => {
    pre.textContent = '取得に失敗しました: ' + err.message;
    pre.classList.add('err');
  });
  return c;
}

(async () => {
  const list = document.getElementById('list');
  try {
    const res = await fetch(BASE + 'list.json', {cache:'no-store'});
    const items = await res.json();
    list.textContent = '';
    items.forEach(it => list.append(card(it)));
  } catch (err) {
    list.textContent = '';
    list.append(el('p', {class:'err'}, '一覧の取得に失敗しました: ' + err.message));
  }
  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    list.querySelectorAll('.card').forEach(c => { c.hidden = q && !c.dataset.search.includes(q); });
  });
})();
</script>
</body>
</html>
